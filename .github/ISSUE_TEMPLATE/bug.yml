name: Bug Report
description: Report a bug in the Market Data PHP SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out all required fields to help us reproduce and fix the issue.

  - type: dropdown
    id: endpoint
    attributes:
      label: SDK Endpoint
      description: Which part of the SDK is affected?
      options:
        - stocks
        - options
        - markets
        - mutual_funds
        - utilities
        - Client (general)
        - Other
    validations:
      required: true

  - type: input
    id: method
    attributes:
      label: Method
      description: Which method are you calling? (e.g., candles, quote, option_chain)
      placeholder: candles
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Code
      description: Complete, runnable PHP code that demonstrates the bug. Must be self-contained.
      placeholder: |
        <?php
        require 'vendor/autoload.php';

        $client = new MarketDataApp\Client();
        $result = $client->stocks->candles('AAPL', from: '2024-01-01');
        // Bug: ...
      render: php
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: The method should return candle data for the specified date range.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include any error messages.
      placeholder: |
        TypeError: Cannot access property on null
        Stack trace: ...
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK Version
      description: Run `composer show marketdataapp/sdk-php` to find this
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      description: Run `php -v` to find this
      placeholder: "8.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Any other relevant information (config, workarounds tried, etc.)
    validations:
      required: false
